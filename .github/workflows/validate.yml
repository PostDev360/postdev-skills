name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skills and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate every SKILL.md
        run: python3 .github/scripts/validate_skills.py

      - name: Check relative Markdown links
        run: python3 .github/scripts/check_links.py
